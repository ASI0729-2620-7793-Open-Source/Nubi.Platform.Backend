spring.application.name=Nubi.Platform.Backend

# Puerto HTTP: Render (y otros PaaS) lo entregan en la variable PORT
server.port=${PORT:8080}

# Base de datos MySQL (valores por variables de entorno)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nubi_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Pool pequeno: el plan gratuito de Render tiene poca memoria y MySQL vive en otra maquina
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=20000

# Cuenta de demostracion (demo@nubi.app / nubi123) con un nino de ejemplo
nubi.demo.enabled=${NUBI_DEMO_ENABLED:true}
