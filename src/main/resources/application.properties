spring.application.name=Nubi.Platform.Backend

# Base de datos MySQL (valores por variables de entorno).
# El esquema del Bounded Context se fija A NIVEL DE CONEXIÓN: MySQL Connector/J
# trata "schema" como sinónimo de "database" y Hibernate no califica el SQL con
# @Table(schema=...) (se genera "from subscription", sin "profile."). Sin el
# esquema en la URL, cada consulta solo funciona en la conexión que ejecutó el
# "USE profile" del script de init y el resto falla con 1046
# "No database selected".
# createDatabaseIfNotExist crea el esquema en el primer arranque.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/profile?createDatabaseIfNotExist=true}
spring.datasource.username=root
spring.datasource.password=YYDKE@94luna
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Crea (si no existe) la base de datos del BC antes de generar sus tablas.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/create-profile-schema.sql
