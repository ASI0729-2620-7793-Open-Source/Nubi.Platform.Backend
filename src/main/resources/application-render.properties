# Perfil "render": despliegue de demostración en Render sin base de datos externa.
# Se activa con SPRING_PROFILES_ACTIVE=render. Usa H2 en memoria en modo MySQL:
# los datos se pierden al reiniciar el servicio (Render duerme el plan gratuito tras 15 min),
# pero el backend vuelve a crear el catálogo y la cuenta demo al arrancar.
# Para datos persistentes, usa el perfil por defecto con MySQL (ver docs/deploy/README.md).
spring.datasource.url=jdbc:h2:mem:nubi;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create
