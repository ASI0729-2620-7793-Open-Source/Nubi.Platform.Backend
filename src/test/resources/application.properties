# Configuración de pruebas: H2 en memoria, sin tocar MySQL.
# INIT crea el esquema "profile" antes de que Hibernate genere las tablas.
spring.datasource.url=jdbc:h2:mem:nubi_test;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS profile
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
